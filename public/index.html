<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fiches techniques Programmation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
[hidden] { display: none !important; }
/* Layout: sticky bar, then either the list of events or one fiche laid out in the same order as the Word sheet. */
:root {
  --bg: #EDF0EB; --surface: #FAFBF8; --sunk: #E3E8E2; --ink: #17211C; --muted: #5C6A62; --line: #CBD3CC;
  --accent: #1D6A4A; --accent-ink: #FFFFFF; --accent-soft: #D7E8DE;
  --warn: #9A5A00; --warn-bg: #F8E6C6; --ok: #22744A; --ok-bg: #D6EBDD; --danger: #B3261E; --danger-bg: #F6DAD7;
  --seg-montage: #7A8F84; --seg-sound: #C98A1B; --seg-show: #1D6A4A; --seg-demo: #9AA79F;
  --art-a: #2F64A8; --art-b: #6D4FA8; --mom: #8C5E1A; --zone: rgba(179, 38, 30, .07);
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F1512; --surface: #171F1A; --sunk: #121915; --ink: #E4EBE6; --muted: #92A198; --line: #2B3731;
  --accent: #5FC493; --accent-ink: #0B1A12; --accent-soft: #1C3328;
  --warn: #F1B254; --warn-bg: #3A2B10; --ok: #6CCB9A; --ok-bg: #173226; --danger: #F2877C; --danger-bg: #3C1A17;
  --seg-montage: #66796F; --seg-sound: #D99B2E; --seg-show: #5FC493; --seg-demo: #4C5A52;
  --art-a: #7FA9E6; --art-b: #B79BEA; --mom: #E0B36A; --zone: rgba(242, 135, 124, .09);
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0F1512; --surface: #171F1A; --sunk: #121915; --ink: #E4EBE6; --muted: #92A198; --line: #2B3731;
  --accent: #5FC493; --accent-ink: #0B1A12; --accent-soft: #1C3328;
  --warn: #F1B254; --warn-bg: #3A2B10; --ok: #6CCB9A; --ok-bg: #173226; --danger: #F2877C; --danger-bg: #3C1A17;
  --seg-montage: #66796F; --seg-sound: #D99B2E; --seg-show: #5FC493; --seg-demo: #4C5A52;
  --art-a: #7FA9E6; --art-b: #B79BEA; --mom: #E0B36A; --zone: rgba(242, 135, 124, .09);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.wrap { max-width: 980px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.bar .wrap { display: flex; align-items: center; gap: 12px; min-height: 56px; padding-block: 8px; flex-wrap: wrap; }
.brand { font: 700 20px/1 var(--display); letter-spacing: .04em; text-transform: uppercase; margin-right: auto; display: flex; align-items: baseline; gap: 10px; cursor: pointer; background: none; border: 0; padding: 0; }
.brand small { font: 500 12px var(--mono); letter-spacing: 0; text-transform: none; color: var(--muted); }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 7px 14px; cursor: pointer; font-weight: 500; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.sm { padding: 4px 10px; font-size: 13px; min-height: 0; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--danger); }
.btn.danger.armed { background: var(--danger); color: var(--surface); border-color: var(--danger); }
.btn[disabled] { opacity: .5; cursor: default; }
.savestate { font: 12px var(--mono); color: var(--muted); }

/* List */
main { padding-block: 24px 64px; }
.tools { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 20px; }
.search { flex: 1 1 240px; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 8px 12px; }
.group-h { font: 600 13px var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 28px 0 8px; display: flex; gap: 8px; }
.list { display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.row { display: grid; grid-template-columns: 112px 64px minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 12px 16px; background: var(--surface); cursor: pointer; text-align: left; border: 0; width: 100%; }
.row:hover { background: var(--sunk); }
.row .d { font: 500 13px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.row .n { font: 500 13px var(--mono); }
.row .t { min-width: 0; }
.row .t b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .t span { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.chip { font-size: 12px; font-weight: 500; padding: 2px 8px; border-radius: 99px; background: var(--warn-bg); color: var(--warn); white-space: nowrap; }
.chip.ok { background: var(--ok-bg); color: var(--ok); }
.chip.off { background: var(--sunk); color: var(--muted); }
@media (max-width: 640px) {
  .row { grid-template-columns: 1fr auto; gap: 4px 12px; }
  .row .d { grid-column: 1; } .row .n { grid-column: 2; text-align: right; }
  .row .t { grid-column: 1 / -1; } .chips { grid-column: 1 / -1; justify-content: flex-start; }
}
.empty { border: 1px dashed var(--line); border-radius: var(--r); padding: 40px 24px; text-align: center; color: var(--muted); }
.empty h2 { font: 600 22px var(--display); letter-spacing: .04em; text-transform: uppercase; color: var(--ink); margin: 0 0 6px; }
.empty p { margin: 0 auto 16px; max-width: 46ch; }
.notice { padding: 10px 14px; border-radius: var(--r); background: var(--warn-bg); color: var(--warn); margin-bottom: 16px; font-size: 14px; }

/* Fiche */
.sheet-head { display: grid; grid-template-columns: 110px minmax(0, 1fr) 190px; gap: 12px; align-items: end; padding-bottom: 20px; border-bottom: 2px solid var(--ink); }
.sheet-head .lbl { display: block; font: 600 12px var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.sheet-head input { width: 100%; border: 0; border-bottom: 1px solid var(--line); background: transparent; padding: 4px 0; border-radius: 0; }
.sheet-head input:focus { border-bottom-color: var(--accent); outline: none; }
.sheet-head #f-numero { font: 500 26px var(--mono); }
.sheet-head #f-nom { font: 700 30px/1.15 var(--display); letter-spacing: .02em; text-transform: uppercase; }
.sheet-head #f-date { font: 500 16px var(--mono); padding: 9px 0; }
@media (max-width: 640px) { .sheet-head { grid-template-columns: 1fr 1fr; } .sheet-head .nomcell { grid-column: 1 / -1; order: -1; } }
.meta { font-size: 13px; color: var(--muted); margin-top: 8px; min-height: 1.5em; }

section.blk { margin-top: 32px; }
.blk > h2 { font: 700 15px var(--display); letter-spacing: .14em; text-transform: uppercase; margin: 0 0 12px; display: flex; align-items: center; gap: 10px; }
.blk > h2::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; align-items: start; }
@media (max-width: 700px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.f { display: grid; gap: 4px; min-width: 0; }
.f > span { font: 600 12px var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.f input, .f select, .f textarea { width: 100%; min-width: 0; border: 1px solid var(--line); background: var(--bg); border-radius: 4px; padding: 7px 9px; }
.f input:focus, .f select:focus, .f textarea:focus { border-color: var(--accent); outline: none; background: var(--surface); }
.f input[type="time"] { font-family: var(--mono); font-variant-numeric: tabular-nums; }
textarea { resize: vertical; min-height: 120px; line-height: 1.5; }
.fields { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
.fields > *, .panel > * { min-width: 0; }
.row2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.row3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 520px) { .row3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

.yn { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--bg); }
.yn button { border: 0; background: transparent; padding: 4px 14px; cursor: pointer; font: 600 13px var(--display); letter-spacing: .1em; }
.yn button + button { border-left: 1px solid var(--line); }
.yn button.on[data-value="oui"] { background: var(--accent); color: var(--accent-ink); }
.yn button.on[data-value="non"] { background: var(--ink); color: var(--surface); }
.line { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: space-between; }
.line > .lt { font: 700 16px var(--display); letter-spacing: .08em; text-transform: uppercase; }

/* Timeline (frise) */
.horaires { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px 20px; }
@media (max-width: 700px) { .horaires { grid-template-columns: minmax(0, 1fr); } }
.slot { display: grid; grid-template-columns: 124px minmax(0, 1fr) minmax(0, 1fr); gap: 8px; align-items: center; }
.slot > b { font: 600 13px var(--display); letter-spacing: .1em; text-transform: uppercase; display: flex; align-items: center; gap: 7px; }
.slot > b i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; flex: none; }
.slot input { width: 100%; min-width: 0; border: 1px solid var(--line); background: var(--bg); border-radius: 4px; padding: 6px 8px; font-family: var(--mono); }
.slot input:focus { border-color: var(--accent); outline: none; }
.lineup { display: grid; gap: 8px; }
.art { display: grid; grid-template-columns: minmax(140px, 1fr) 150px 96px 96px 116px auto; gap: 8px; align-items: center; padding: 8px; border: 1px solid var(--line); border-radius: var(--r); background: var(--bg); }
.art input, .art select { width: 100%; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 4px; padding: 6px 8px; }
.art input:focus, .art select:focus { border-color: var(--accent); outline: none; }
.art input[type="time"] { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.art .an { font-weight: 600; }
.art .ar { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font: 600 12px var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.art .ar .attach { font: 13px var(--body); letter-spacing: 0; text-transform: none; }
.art .rm { justify-self: end; }
.art .dur { font: 500 13px var(--mono); color: var(--muted); white-space: nowrap; }
.art .dur b { color: var(--ink); font-weight: 500; }
.art .rm.armed { color: var(--danger); font-weight: 600; }
@media (max-width: 760px) { .art { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .art .an, .art select { grid-column: 1 / -1; } .art .rm { grid-column: 1 / -1; order: 10; } .art .dur { grid-column: 1 / -1; } }
.lineup-empty { font-size: 13px; color: var(--muted); }
.add-art { justify-self: start; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--muted); cursor: pointer; text-decoration: underline; font-size: 13px; }
.linkbtn:hover { color: var(--ink); }
.items { display: grid; gap: 8px; }
.item { display: grid; grid-template-columns: 58px minmax(0, 1fr) auto; gap: 6px 8px; align-items: center; padding: 8px; border: 1px solid var(--line); border-radius: var(--r); background: var(--bg); }
.item.done { opacity: .6; }
.item input:not([type="checkbox"]) { width: 100%; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 4px; padding: 5px 8px; }
.item input:focus { border-color: var(--accent); outline: none; }
.item .iq { font-family: var(--mono); text-align: center; }
.item .id { font-weight: 600; }
.item .ir { grid-column: 1 / 3; font-family: var(--mono); font-size: 13px; }
.item .irendu { display: flex; align-items: center; gap: 6px; font-size: 13px; white-space: nowrap; cursor: pointer; }
.item .irendu input { width: 16px; height: 16px; accent-color: var(--accent); }
.who { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.who .wl { font: 600 11px var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.wchip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 2px 10px; font-size: 12px; cursor: pointer; }
.wchip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.who.nobody .wl { color: var(--warn); }
.add-item { justify-self: start; }
.artmat { grid-column: 1 / -1; font-size: 13px; color: var(--muted); }
.artmat b { font-weight: 600; color: var(--ink); }
.communmat { font-size: 13px; color: var(--muted); }
.communmat b { color: var(--ink); }
.frise .track.arts, .frise .track.moms { height: 26px; margin-top: 4px; background: transparent; overflow: visible; }
.frise .track.arts .seg, .frise .track.moms .seg { border-radius: 3px; border-right: 0; box-shadow: 0 0 0 1px var(--surface); }
.frise button.seg { border-top: 0; border-bottom: 0; border-left: 0; cursor: pointer; text-align: left; }
.frise .seg:hover { filter: brightness(1.12); }
.frise .seg.sel, .frise .track.arts .seg.sel, .frise .track.moms .seg.sel { box-shadow: inset 0 0 0 2px var(--ink); z-index: 2; }
.frise .seg.bal { background-image: repeating-linear-gradient(135deg, transparent 0 6px, rgba(255,255,255,.28) 6px 12px); }
.frise .seg.warn { background-color: var(--danger) !important; background-image: none; }
.frise .seg.mom { background: var(--mom); }
.frise .gaps { position: relative; height: 18px; }
.frise .gap { position: absolute; top: 3px; transform: translateX(-50%); font: 10px var(--mono); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 99px; padding: 0 5px; white-space: nowrap; pointer-events: none; z-index: 3; }
.frise .pin { position: absolute; top: 0; bottom: 0; border: 0; border-left: 2px solid var(--mom); padding: 0 0 0 5px; background: transparent; color: var(--mom); font: 600 11px var(--display); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; cursor: pointer; }
.frise .pin.sel { text-decoration: underline; }
.frise .hint { font-size: 12px; color: var(--muted); margin-top: 2px; }
.fedit { margin-top: 10px; padding: 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--bg); display: flex; gap: 12px; flex-wrap: wrap; align-items: end; }
.fedit h4 { margin: 0; flex-basis: 100%; font: 700 14px var(--display); letter-spacing: .1em; text-transform: uppercase; }
.fedit label { display: grid; gap: 4px; font: 600 12px var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.fedit input { border: 1px solid var(--line); background: var(--surface); border-radius: 4px; padding: 6px 8px; font-family: var(--mono); }
.fedit input:focus { border-color: var(--accent); outline: none; }
.moms { display: grid; gap: 8px; }
.mom { display: grid; grid-template-columns: 180px minmax(0, 1fr) 96px 96px auto; gap: 8px; align-items: center; padding: 8px; border: 1px solid var(--line); border-radius: var(--r); background: var(--bg); }
.mom input, .mom select { width: 100%; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 4px; padding: 6px 8px; }
.mom input:focus, .mom select:focus { border-color: var(--accent); outline: none; }
.mom input[type="time"] { font-family: var(--mono); }
.mom .rm.armed { color: var(--danger); font-weight: 600; }
@media (max-width: 760px) { .mom { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .mom select, .mom .ml { grid-column: 1 / -1; } .mom .rm { grid-column: 1 / -1; justify-self: end; } }
.art .btimes { display: inline-flex; gap: 6px; align-items: center; text-transform: none; letter-spacing: 0; }
.art .btimes input { width: 104px; }
.art .arsep { width: 1px; height: 18px; background: var(--line); margin: 0 4px; }
.slot .one { grid-column: 2 / -1; }
.frise { margin-top: 20px; }
.frise .track { position: relative; z-index: 1; height: 34px; background: transparent; border-radius: 4px; overflow: hidden; }
.frise .seg { position: absolute; top: 0; bottom: 0; display: flex; align-items: center; padding: 0 6px; font: 600 11px var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--surface); overflow: hidden; white-space: nowrap; border-right: 1px solid var(--surface); }
.frise .lanes { position: relative; padding-block: 2px; }
.frise .bg, .frise .dl { position: absolute; inset: 0; pointer-events: none; }
.frise .bg i { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line); opacity: .55; }
.frise .bg i.half { opacity: .25; }
.frise .bg .zone { position: absolute; top: 0; bottom: 0; background: var(--zone); }
.frise .dl { z-index: 2; }
.frise .dl b { position: absolute; top: 0; bottom: 0; width: 0; border-left: 2px solid var(--danger); }
.frise .dl b.dash { border-left-style: dashed; }
.frise .doors { position: relative; }
.frise .door { position: absolute; border: 1px solid var(--danger); background: var(--surface); border-radius: 3px; padding: 0 6px; color: var(--danger); font: 600 11px/16px var(--display); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; cursor: pointer; text-decoration: none; z-index: 1; }
.frise .door.right { transform: translateX(-100%); }
.frise .door:hover, .frise .door.sel { background: var(--danger); color: var(--surface); }
.frise .stem { position: absolute; bottom: 0; width: 0; border-left: 2px solid var(--danger); }
.frise .stem.dash { border-left-style: dashed; }
.frise .seg.planned { background: transparent !important; border: 2px dashed var(--seg-show); color: var(--seg-show); }
.frise .seg.derived { cursor: default; }
.frise .ticks { position: relative; height: 18px; font: 11px var(--mono); color: var(--muted); }
.frise .ticks span { position: absolute; transform: translateX(-50%); top: 2px; }
.frise .ph { font-size: 13px; color: var(--muted); padding: 8px 0; }

/* Locations */
.loc { display: grid; gap: 12px; align-content: start; grid-template-columns: minmax(0, 1fr); min-width: 0; }
.loc.off .locbody { display: none; }
.docline { display: grid; grid-template-columns: minmax(0, 1fr) 120px; gap: 8px; align-items: end; }
.attach { display: flex; align-items: center; gap: 8px; font-size: 13px; min-height: 28px; flex-wrap: wrap; }
.attach a { color: var(--accent); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; min-width: 0; flex: 0 1 auto; }
.attach .linkbtn { background: none; border: 0; padding: 0; color: var(--muted); cursor: pointer; text-decoration: underline; font-size: 13px; }
.attach .linkbtn:hover { color: var(--ink); }
.attach .busy { color: var(--muted); }
/* Lire le devis : ce qui sera rempli, puis Remplir / Annuler */
.readbox { border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: var(--r); padding: 10px 12px; font-size: 13px; display: grid; gap: 6px; background: var(--surface); }
.readbox ul { margin: 0; padding-left: 18px; display: grid; gap: 2px; }
.readbox .ok { color: var(--muted); }
.readbox .bad { color: var(--danger); }
.readbox .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.subtle { color: var(--muted); font-size: 13px; }

.contact { display: grid; gap: 10px; }
.contact h3 { margin: 0; font: 700 14px var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: var(--r); font-size: 14px; z-index: 20; max-width: calc(100% - 32px); }
.ro input, .ro select, .ro textarea { pointer-events: none; opacity: .85; }
@media (prefers-reduced-motion: no-preference) { .row, .btn { transition: background-color .12s, border-color .12s; } }
.login { max-width: 380px; margin: 12vh auto 0; display: grid; gap: 14px; }
.login h1 { font: 700 28px var(--display); letter-spacing: .04em; text-transform: uppercase; margin: 0; }
.login p { margin: 0; color: var(--muted); }
.login .err { color: var(--danger); font-size: 14px; min-height: 1.4em; }
</style>
</head>
<body>

<header class="bar">
  <div class="wrap">
    <button class="brand" id="home" type="button">Fiches techniques <small>programmation</small></button>
    <span class="savestate" id="savestate"></span>
    <div class="actions" id="topactions"></div>
  </div>
</header>

<main class="wrap" id="app">
  <div class="empty"><h2>Chargement des fiches…</h2><p>Les fiches de l'équipe s'affichent ici dès qu'elles sont chargées.</p></div>
</main>
<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="/devis-reader.js"></script>
<script>
(() => {
"use strict";
const LOCS = [
  { k: "backline", t: "Backline" },
  { k: "lumiere", t: "Lumière" },
  { k: "machinerie", t: "Machinerie" },
  { k: "autre", t: "Autre" },
];
const DEVIS_ST = ["", "Demandé", "Reçu", "Validé"];
const FACT_ST = ["", "Attendue", "Reçue", "Payée"];
const $ = (s, r = document) => r.querySelector(s);
const app = $("#app");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

let me = "";               // first name typed at login, shown as "modifiée par"
let pollTimer = null;
let canWrite = true;
let events = new Map();     // id -> data
let loaded = false, loadTimer = null, loadNote = "";
let current = null;         // id of the open fiche
let pending = {};           // path -> value not yet written
let inflight = new Map();   // path -> value being written
let flushTimer = null;
let search = "";

// ---------- helpers ----------
function get(o, path) { return path.split(".").reduce((a, k) => (a == null ? undefined : a[k]), o); }
function setIn(o, path, v) { const ks = path.split("."); let c = o; ks.slice(0, -1).forEach(k => { if (c[k] == null || typeof c[k] !== "object") c[k] = {}; c = c[k]; }); c[ks[ks.length - 1]] = v; }
function clone(o) { return JSON.parse(JSON.stringify(o || {})); }
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 3200); }
function todayISO() { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); }
function fmtDate(iso, long) {
  if (!iso) return "";
  const d = new Date(iso + "T12:00:00");
  if (isNaN(d)) return iso;
  return d.toLocaleDateString("fr-FR", long ? { weekday: "long", day: "numeric", month: "long", year: "numeric" } : { weekday: "short", day: "2-digit", month: "short", year: "numeric" });
}
function fmtTime(t) { return t ? t.replace(":", "h") : ""; }
function range(a, b) { return a && b ? `${fmtTime(a)} – ${fmtTime(b)}` : (a ? `à partir de ${fmtTime(a)}` : (b ? `jusqu'à ${fmtTime(b)}` : "")); }
function blankEvent() {
  const loc = {};
  LOCS.forEach(l => loc[l.k] = { actif: "", loueur: "", devis: { ref: "", statut: "", file: null }, facture: { ref: "", statut: "", file: null } });
  loc.autre.label = "";
  const contacts = {};
  [1, 2, 3, 4].forEach(i => contacts["c" + i] = { nom: "", fonction: "", tel: "", mail: "" });
  return { numero: "", nom: "", date: "", artistes: "", rider: "", riderFile: null, lineup: {},
    h: { montageDebut: "", montageFin: "", soundcheckDebut: "", soundcheckFin: "", ouverture: "", duree: "", fermPublic: "", fermPortes: "", demontageDebut: "", demontageFin: "" },
    loc, contacts, commentaires: "", createdAt: Date.now(), updatedAt: Date.now(), updatedBy: me || "" };
}

// Artists of a fiche, sorted by set time (sets after midnight count as late).
const TYPES = ["Groupe", ["DJ", ["DJ CDJ", "DJ vinyle", "DJ CDJ + vinyle", "DJ"]], "Live", "Autre"];
// The working day starts at the first general time (montage…); anything more than 3h earlier is after midnight.
function mainTimes(e) {
  const h = (e && e.h) || {};
  const order = ["montageDebut", "montageFin", "soundcheckDebut", "soundcheckFin", "ouverture", "fermPublic", "fermPortes", "demontageDebut", "demontageFin"];
  const t = {}; let prev = null, plus = 0;
  order.forEach(k => { let v = mins(h[k]); if (v == null) return; v += plus; if (prev != null && v < prev - 60) { plus += 1440; v += 1440; } t[k] = v; prev = v; });
  return t;
}
function relOf(e) { const v = Object.values(mainTimes(e)); const start = v.length ? Math.min(...v) : 480; return x => (x == null ? null : x < start - 180 ? x + 1440 : x); }
function artMins(t, rel) { return rel(mins(t)); }
function lineupOf(e) {
  let list;
  if (e.lineup && typeof e.lineup === "object") list = Object.entries(e.lineup).filter(([, a]) => a).map(([id, a]) => ({ id, ...a }));
  else list = (e.artistes || e.rider) ? [{ id: "a0", nom: e.artistes || "", type: "", debut: "", fin: "", rider: e.rider || "", riderFile: e.riderFile || null, createdAt: 0 }] : [];
  const rel = relOf(e);
  return list.sort((a, b) => {
    const x = artMins(a.debut, rel), y = artMins(b.debut, rel);
    if (x != null && y != null && x !== y) return x - y;
    if (x == null && y != null) return 1;
    if (y == null && x != null) return -1;
    return (a.createdAt || 0) - (b.createdAt || 0);
  });
}
function itemsOf(L) {
  return Object.entries((L && L.items) || {}).filter(([, it]) => it).map(([id, it]) => ({ id, ...it })).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
}
function whoOf(it) { return Object.entries(it.who || {}).filter(([, v]) => v).map(([k]) => k); }
function itemLabel(it) { return `${it.qte ? it.qte + "× " : ""}${it.des || "Matériel"}`; }
function fmtDur(m) { if (m == null || m <= 0) return ""; const h = Math.floor(m / 60), r = m % 60; return h ? `${h}h${r ? String(r).padStart(2, "0") : ""}` : `${r} min`; }
function setMins(a) { const x = mins(a.debut), y = mins(a.fin); if (x == null || y == null) return null; let d = y - x; if (d <= 0) d += 1440; return d; }
// From the first set's start to the last set's end, sets after midnight included.
function showMins(e) {
  const rel = relOf(e);
  let lo = null, hi = null;
  lineupOf(e).forEach(a => { const x = artMins(a.debut, rel), d = setMins(a); if (x == null || d == null) return; lo = lo == null ? x : Math.min(lo, x); hi = hi == null ? x + d : Math.max(hi, x + d); });
  return lo == null ? null : hi - lo;
}
const MOM_TYPES = ["Arrivée équipe", "Arrivée artiste", "Repas midi", "Repas soir", "Catering", "Changement de plateau", "Curfew", "Autre"];
function momentsOf(e) {
  const rel = relOf(e);
  return Object.entries(e.moments || {}).filter(([, m]) => m).map(([id, m]) => ({ id, ...m }))
    .sort((a, b) => (rel(mins(a.debut)) ?? 1e9) - (rel(mins(b.debut)) ?? 1e9) || (a.createdAt || 0) - (b.createdAt || 0));
}
// Everything placed on one time axis, plus what looks wrong.
function planning(e) {
  const t = mainTimes(e), rel = relOf(e);
  const span = (x, y) => { const a = rel(mins(x)); let b = rel(mins(y)); if (a != null && b != null && b <= a) b += 1440; return [a, b]; };
  const arts = lineupOf(e);
  const sets = arts.map((x, i) => { const [a, b] = span(x.debut, x.fin); return { id: x.id, nom: x.nom || "Artiste", i, a, b }; }).filter(x => x.a != null && x.b != null).sort((x, y) => x.a - y.a);
  const bals = arts.filter(x => x.balance === "oui").map((x, i) => { const [a, b] = span(x.bdebut, x.bfin); return { id: x.id, nom: x.nom || "Artiste", i: arts.indexOf(x), a, b }; }).filter(x => x.a != null && x.b != null);
  const moms = momentsOf(e).map(m => { const [a, b] = span(m.debut, m.fin); return { ...m, a, b }; }).filter(m => m.a != null);
  const gaps = [], issues = [];
  for (let k = 1; k < sets.length; k++) {
    const p = sets[k - 1], n = sets[k];
    if (n.a < p.b) { p.conflict = n.conflict = true; } else if (n.a > p.b) gaps.push({ a: p.b, b: n.a });
  }
  if (sets.some(x => x.conflict)) issues.push("Passages qui se chevauchent");
  if (t.ouverture != null) {
    const end = t.fermPublic ?? t.fermPortes ?? Infinity;
    bals.forEach(x => { if (x.b > t.ouverture && x.a < end) x.warn = true; });
    if (bals.some(x => x.warn)) issues.push("Balance après l'ouverture des portes");
  }
  const limits = [t.fermPublic].concat(moms.filter(m => m.type === "Curfew").map(m => m.a)).filter(x => x != null);
  if (limits.length) { const L = Math.min(...limits); sets.forEach(x => { if (x.b > L) x.late = true; }); if (sets.some(x => x.late)) issues.push("Passage après la fermeture au public"); }
  return { t, sets, bals, moms, gaps, issues };
}
function artistsLine(e) { return lineupOf(e).map(a => a.nom).filter(Boolean).join(" · "); }

// What still needs attention on a fiche
function missing(e) {
  const out = [];
  const past = e.date && e.date < todayISO();
  if (!e.date) out.push("Date");
  const arts = lineupOf(e);
  if (!arts.length) out.push("Line-up");
  if (arts.some(a => !a.rider)) out.push("Rider ?");
  if (arts.some(a => a.rider === "oui" && !a.riderFile)) out.push("Rider à joindre");
  planning(e).issues.forEach(x => out.push(x));
  if (!get(e, "h.montageDebut") || !get(e, "h.ouverture")) out.push("Horaires");
  LOCS.forEach(l => {
    const L = get(e, "loc." + l.k) || {};
    if (l.k !== "autre" && !L.actif) out.push(l.t + " ?");
    if (L.actif === "oui" || l.k === "autre") {
      const its = itemsOf(L);
      if (its.some(it => !whoOf(it).length)) out.push("Matériel " + l.t.toLowerCase() + " sans artiste");
      const left = its.filter(it => !it.rendu).length;
      if (past && left) out.push(`Reprise ${l.t.toLowerCase()} : ${left} à rendre`);
    }
    if (L.actif === "oui") {
      if (get(L, "devis.statut") !== "Validé") out.push("Devis " + l.t.toLowerCase());
      if (past && !["Reçue", "Payée"].includes(get(L, "facture.statut"))) out.push("Facture " + l.t.toLowerCase());
    }
  });
  return out;
}

// ---------- API ----------
async function api(method, url, body) {
  const r = await fetch(url, { method, headers: body ? { "Content-Type": "application/json" } : {}, body: body ? JSON.stringify(body) : undefined, credentials: "same-origin" });
  if (r.status === 401) { showLogin(); throw { code: "auth" }; }
  if (!r.ok) throw { code: r.status === 404 ? "not_found" : "server", status: r.status };
  return r.status === 204 ? null : r.json();
}
function newId() { const a = crypto.getRandomValues(new Uint8Array(12)); return Array.from(a, b => "abcdefghijklmnopqrstuvwxyz0123456789"[b % 36]).join(""); }
async function refresh() {
  try {
    const { events: list } = await api("GET", "/api/events");
    const next = new Map(); list.forEach(({ id, ...d }) => next.set(id, d));
    events = next; loaded = true; clearTimeout(loadTimer); loadNote = "";
    render(true);
  } catch (e) {
    if (e.code === "auth") return;
    loaded = true; loadNote = "Impossible de joindre les fiches pour le moment. Nouvel essai dans quelques secondes."; render();
  }
}
function startPolling() {
  clearInterval(pollTimer);
  pollTimer = setInterval(() => { if (!document.hidden && !Object.keys(pending).length && !inflight.size) refresh(); }, 8000);
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && pollTimer) refresh(); });
function showLogin(msg) {
  clearInterval(pollTimer); pollTimer = null;
  renderTop(""); $("#savestate").textContent = "";
  app.innerHTML = `<form class="login" id="login">
    <h1>Fiches techniques</h1>
    <p>Accès réservé à l'équipe.</p>
    <label class="f"><span>Ton prénom</span><input id="l-name" autocomplete="given-name" required value="${esc(me)}"></label>
    <label class="f"><span>Mot de passe</span><input id="l-pw" type="password" autocomplete="current-password" required></label>
    <button class="btn primary" type="submit">Entrer</button>
    <div class="err" id="l-err">${esc(msg || "")}</div></form>`;
  $("#login").onsubmit = async (ev) => {
    ev.preventDefault();
    const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ password: $("#l-pw").value }) });
    if (!r.ok) { $("#l-err").textContent = r.status === 401 ? "Mot de passe incorrect." : "Le site n'est pas encore configuré (mot de passe manquant dans Vercel)."; return; }
    me = $("#l-name").value.trim(); try { localStorage.setItem("ftp-name", me); } catch (e) {}
    start();
  };
}
async function start() {
  app.innerHTML = `<div class="empty"><h2>Chargement des fiches…</h2><p>Les fiches de l'équipe s'affichent ici dès qu'elles sont chargées.</p></div>`;
  loadTimer = setTimeout(() => { loadNote = "Les fiches ne répondent pas encore. Vérifie ta connexion."; render(); }, 10000);
  await refresh();
  startPolling();
}

// ---------- boot ----------
async function boot() {
  try { me = localStorage.getItem("ftp-name") || ""; } catch (e) {}
  window.addEventListener("hashchange", () => { flush(); render(); });
  try {
    const r = await fetch("/api/login", { credentials: "same-origin" });
    const st = await r.json();
    if (st.ok && me) return start();
  } catch (e) {}
  showLogin();
}
function route() { const m = location.hash.match(/^#fiche-([A-Za-z0-9_-]+)$/); return m ? m[1] : null; }
function go(id) { location.hash = id ? "fiche-" + id : ""; if (!id && location.hash === "") render(); }

// ---------- render ----------
function render(fromSnap) {
  const id = route();
  if (id) {
    if (!loaded) return;
    if (!events.has(id)) { current = null; renderList(); if (render.tried !== id) { render.tried = id; refresh(); } return; }
    if (current !== id || !$("#sheet")) { current = id; pending = {}; renderSheet(id); }
    else if (fromSnap) syncSheet(id);
    return;
  }
  current = null;
  renderList();
}

function renderTop(html) { $("#topactions").innerHTML = html; }

function renderList() {
  $("#savestate").textContent = "";
  renderTop(canWrite ? `<button class="btn primary" id="new" type="button">Nouvelle fiche</button>` : "");
  const nb = $("#new"); if (nb) nb.onclick = createEvent;
  if (!loaded) return;
  const q = search.trim().toLowerCase();
  const all = [...events.entries()].map(([id, e]) => ({ id, e })).filter(({ e }) => !q || [e.numero, e.nom, artistsLine(e), ...LOCS.map(l => get(e, "loc." + l.k + ".loueur"))].join(" ").toLowerCase().includes(q));
  const today = todayISO();
  const up = all.filter(x => !x.e.date || x.e.date >= today).sort((a, b) => (a.e.date || "9999").localeCompare(b.e.date || "9999"));
  const past = all.filter(x => x.e.date && x.e.date < today).sort((a, b) => b.e.date.localeCompare(a.e.date));
  const rowHtml = ({ id, e }) => {
    const m = missing(e);
    const chips = m.length ? m.slice(0, 4).map(x => `<span class="chip">${esc(x)}</span>`).join("") + (m.length > 4 ? `<span class="chip">+${m.length - 4}</span>` : "") : `<span class="chip ok">Complète</span>`;
    return `<button class="row" type="button" data-id="${esc(id)}">
      <span class="d">${esc(fmtDate(e.date) || "Sans date")}</span>
      <span class="n">${esc(e.numero || "—")}</span>
      <span class="t"><b>${esc(e.nom || "Sans nom")}</b><span>${esc(artistsLine(e) || "Line-up à préciser")}</span></span>
      <span class="chips">${chips}</span></button>`;
  };
  let body = "";
  if (loadNote) body += `<div class="notice">${esc(loadNote)}</div>`;
  if (!canWrite) body += `<div class="notice">Tu peux consulter les fiches mais pas les modifier. Demande au propriétaire de te donner l'accès Éditeur.</div>`;
  if (!events.size) {
    body += `<div class="empty"><h2>Aucune fiche pour l'instant</h2><p>Crée une fiche par événement : horaires, locations backline, lumière et machinerie, contacts et commentaires. Elle s'exporte ensuite en Word, dans la mise en page habituelle.</p>${canWrite ? `<button class="btn primary" type="button" id="new2">Créer la première fiche</button>` : ""}</div>`;
  } else {
    body += `<div class="tools"><input class="search" id="search" type="search" placeholder="Chercher un projet, un artiste, un loueur…" value="${esc(search)}" aria-label="Chercher"></div>`;
    body += `<div class="group-h">À venir <span>${up.length}</span></div>` + (up.length ? `<div class="list">${up.map(rowHtml).join("")}</div>` : `<p class="subtle">Aucun événement à venir${q ? " pour cette recherche" : ""}.</p>`);
    if (past.length) body += `<div class="group-h">Passés <span>${past.length}</span></div><div class="list">${past.map(rowHtml).join("")}</div>`;
  }
  const hadFocus = document.activeElement && document.activeElement.id === "search";
  const caret = hadFocus ? document.activeElement.selectionStart : 0;
  app.innerHTML = body;
  app.querySelectorAll(".row").forEach(r => r.onclick = () => go(r.dataset.id));
  const n2 = $("#new2"); if (n2) n2.onclick = createEvent;
  const s = $("#search");
  if (s) {
    s.oninput = () => { search = s.value; renderList(); };
    if (hadFocus) { s.focus(); s.setSelectionRange(caret, caret); }
  }
}

async function createEvent() {
  const id = newId(), d = blankEvent();
  try { await api("POST", "/api/events", { id, data: d }); events.set(id, d); go(id); }
  catch (e) { handleWriteError(e); }
}

// ---------- the fiche ----------
function ynHtml(path) { return `<div class="yn" role="group"><button type="button" data-yn="${path}" data-value="oui">OUI</button><button type="button" data-yn="${path}" data-value="non">NON</button></div>`; }
function attachHtml(path, label) { return `<div class="attach" data-file="${path}" data-label="${esc(label)}"></div>`; }
function slot(label, color, a, b) {
  return `<div class="slot"><b><i style="background:var(${color})"></i>${label}</b>
    <input type="time" data-path="h.${a}" aria-label="${label} début">${b ? `<input type="time" data-path="h.${b}" aria-label="${label} fin">` : ""}</div>`;
}

function renderSheet(id) {
  const locHtml = LOCS.map(l => `
    <div class="panel loc" data-loc="${l.k}">
      <div class="line"><span class="lt">${l.k === "autre" ? "Autre" : "Location " + l.t}</span>${l.k === "autre" ? "" : ynHtml("loc." + l.k + ".actif")}</div>
      <div class="locbody fields">
        ${l.k === "autre" ? `<label class="f"><span>Quoi</span><input data-path="loc.autre.label" placeholder="Ex. groupe électrogène, praticables…"></label>` : ""}
        <label class="f"><span>Loueur</span><input data-path="loc.${l.k}.loueur" list="dl-loueurs" autocomplete="off"></label>
        <div class="docline"><label class="f"><span>Devis</span><input data-path="loc.${l.k}.devis.ref" placeholder="N° ou montant"></label>
          <label class="f"><span>Statut</span><select data-path="loc.${l.k}.devis.statut">${DEVIS_ST.map(s => `<option value="${s}">${s || "—"}</option>`).join("")}</select></label></div>
        ${attachHtml("loc." + l.k + ".devis.file", "Joindre le devis")}
        <div class="readbox" data-readbox="${l.k}" hidden></div>
        <div class="docline"><label class="f"><span>Facture</span><input data-path="loc.${l.k}.facture.ref" placeholder="N° ou montant"></label>
          <label class="f"><span>Statut</span><select data-path="loc.${l.k}.facture.statut">${FACT_ST.map(s => `<option value="${s}">${s || "—"}</option>`).join("")}</select></label></div>
        ${attachHtml("loc." + l.k + ".facture.file", "Joindre la facture")}
        <div class="f"><span>Matériel loué</span>
          <div class="items" data-items="${l.k}"></div>
          ${canWrite ? `<button type="button" class="btn add-item" data-add-item="${l.k}">+ Ajouter du matériel</button>` : ""}
        </div>
      </div>
    </div>`).join("");
  const contactHtml = [1, 2, 3, 4].map(i => `
    <div class="panel contact">
      <h3>Contact ${i}</h3>
      <div class="row2"><label class="f"><span>Nom / prénom</span><input data-path="contacts.c${i}.nom" data-contact="c${i}" list="dl-contacts" autocomplete="off"></label>
      <label class="f"><span>Fonction</span><input data-path="contacts.c${i}.fonction" list="dl-fonctions" autocomplete="off"></label></div>
      <div class="row2"><label class="f"><span>Téléphone</span><input data-path="contacts.c${i}.tel" type="tel" inputmode="tel"></label>
      <label class="f"><span>Mail</span><input data-path="contacts.c${i}.mail" type="email" inputmode="email"></label></div>
    </div>`).join("");

  app.innerHTML = `
  <div id="sheet" class="${canWrite ? "" : "ro"}">
    ${canWrite ? "" : `<div class="notice">Lecture seule : demande l'accès Éditeur pour modifier cette fiche.</div>`}
    <div class="sheet-head">
      <label><span class="lbl">Projet n°</span><input id="f-numero" data-path="numero" placeholder="000" inputmode="numeric"></label>
      <label class="nomcell"><span class="lbl">Nom du projet</span><input id="f-nom" data-path="nom" placeholder="Nom du projet"></label>
      <label><span class="lbl">Date</span><input id="f-date" type="date" data-path="date"></label>
    </div>
    <div class="meta" id="meta"></div>

    <section class="blk"><h2>Détails</h2>
      <div class="panel fields">
        <div class="f"><span>Line-up</span>
          <div class="lineup" id="lineup"></div>
          <div class="communmat" id="communmat"></div>
          ${canWrite ? `<button type="button" class="btn add-art" id="add-art">+ Ajouter un artiste</button>` : ""}
        </div>
        <div class="horaires">
          <div class="fields">
            ${slot("Montage", "--seg-montage", "montageDebut", "montageFin")}
            ${slot("Soundcheck", "--seg-sound", "soundcheckDebut", "soundcheckFin")}
            ${slot("Démontage", "--seg-demo", "demontageDebut", "demontageFin")}
          </div>
          <div class="fields">
            ${slot("Portes", "--seg-show", "ouverture")}

    const el = ev.target; if (!el.dataset.path || !canWrite) return;
    edit(el.dataset.path, el.value);

  });
  sheet.addEventListener("change", (ev) => {
    const el = ev.target;
    if (el.dataset.contact) autofillContact(el.dataset.contact, el.value);
    if (el.dataset.chk && canWrite) { edit(el.dataset.chk, el.checked); flush(); syncSheet(id); return; }
    if (el.tagName === "SELECT" || el.type === "date" || el.type === "time") flush();

  sheet.addEventListener("focusout", (ev) => {
    if (Object.keys(pending).length) scheduleFlush(250);

    const ri = ev.target.closest("[data-rm-item]");
    if (ri) {
      if (!ri.classList.contains("armed")) { ri.classList.add("armed"); ri.textContent = "Confirmer"; setTimeout(() => { if (ri.isConnected) { ri.classList.remove("armed"); ri.textContent = "Retirer"; } }, 3000); return; }
      edit(ri.dataset.rmItem, null); flush(); syncSheet(id); return;

    const rm = ev.target.closest("[data-rm-art]");

      if (!rm.classList.contains("armed")) { rm.classList.add("armed"); rm.textContent = "Confirmer"; setTimeout(() => { if (rm.isConnected) { rm.classList.remove("armed"); rm.textContent = "Retirer"; } }, 3000); return; }

    }
    const b = ev.target.closest("[data-yn]"); if (!b) return;
    const path = b.dataset.yn, cur = get(localDoc(), path);
    const v = cur === b.dataset.value ? "" : b.dataset.value;
    edit(path, v); flush(); syncSheet(id);
  });
  // Fiches made before the line-up existed: turn the single artist field into the first artist.
  const cur = events.get(id);

  if (!get(events.get(id), "nom") && canWrite) $("#f-nom").focus({ preventScroll: true });
  syncSheet(id);
  window.scrollTo(0, 0);
}

function localDoc() {

function renderAttach(el, d) {
  const path = el.dataset.file, f = get(d, path);

    const href = f.path ? "/api/file?p=" + encodeURIComponent(f.path) : f.url;
    const canRead = canWrite && f.path && /\.devis\.file$/.test(path) && /\.pdf$/i.test(f.name || f.path);
    el.innerHTML = `<a href="${esc(href)}" target="_blank" rel="noopener" title="${esc(f.name || "")}">📎 ${esc(f.name || "Pièce jointe")}</a>${canRead ? `<button type="button" class="btn sm" data-read>Lire le devis</button>` : ""}${canWrite ? `<button type="button" class="linkbtn" data-rm>retirer</button>` : ""}`;

    const rm = el.querySelector("[data-rm]"); if (rm) rm.onclick = () => { edit(path, null); flush(); renderAttach(el, localDoc()); };

  }

// ---------- Lire le devis (PDF) et remplir la location ----------
// Lecture dans le navigateur (public/devis-reader.js + pdf.js) : le PDF n'est envoyé nulle part.
// Remplit seulement ce qui est vide (loueur, devis, statut) et ajoute les lignes de matériel absentes.
const RE_TRANSPORT = /\b(transport|livraison|enl[eè]vement|frais\s+de\s+port|d[ée]placement|a\/r)\b/i;
const keyOf = (s) => String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
const euro = (n) => n == null ? "" : n.toLocaleString("fr-FR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " € HT";
async function readDevis(k, f) {
  const box = app.querySelector(`[data-readbox="${k}"]`); if (!box) return;
  box.hidden = false; box.innerHTML = `<span class="ok">Lecture du devis…</span>`;
  let r;
  try {
    const res = await fetch("/api/file?p=" + encodeURIComponent(f.path), { credentials: "same-origin" });
    if (res.status === 401) { showLogin(); return; }
    if (!res.ok) throw new Error("file");
    const loueurs = new Set(); events.forEach(e => LOCS.forEach(l => { const v = get(e, "loc." + l.k + ".loueur"); if (v) loueurs.add(v.trim()); }));
    r = await window.DevisReader.read(new Uint8Array(await res.arrayBuffer()), { knownSuppliers: [...loueurs] });
  } catch (e) {
    box.innerHTML = `<span class="bad">Impossible de lire ce PDF.</span> <button type="button" class="linkbtn" data-close>Fermer</button>`;
    box.querySelector("[data-close]").onclick = () => box.hidden = true; return;
  }
  if (!r.hasText) {
    box.innerHTML = `<span class="bad">Ce PDF ne contient pas de texte (scan ou photo) : il faut remplir à la main.</span> <button type="button" class="linkbtn" data-close>Fermer</button>`;
    box.querySelector("[data-close]").onclick = () => box.hidden = true; return;
  }
  const d = localDoc(), L = get(d, "loc." + k) || {};
  const have = new Set(itemsOf(L).map(it => keyOf(it.des)));
  const arts = (r.articles && r.articles.length ? r.articles : r.lignes.map(t => { const m = /^(\d+(?:,\d+)?)\s+(.*)$/.exec(t); return m ? { q: parseFloat(m[1].replace(",", ".")), d: m[2] } : { q: 1, d: t }; }));
  // « 1x Rallonge P17 » : the quantity is written in the designation
  arts.forEach(a => { const m = /^(\d+(?:[.,]\d+)?)\s*[x×*]\s*(\S.*)$/i.exec(a.d || ""); if (m) { a.q = parseFloat(m[1].replace(",", ".")); a.d = m[2]; } });
  const transport = arts.filter(a => RE_TRANSPORT.test(a.d));
  const items = arts.filter(a => !RE_TRANSPORT.test(a.d) && a.d && !have.has(keyOf(a.d)));
  const dup = arts.length - transport.length - items.length;
  const devisTxt = [r.ref ? "N° " + r.ref : "", euro(r.totalHT)].filter(Boolean).join(" · ");
  const plan = [];
  if (r.fournisseur) plan.push(L.loueur ? `Loueur : déjà rempli (${esc(L.loueur)})` : `Loueur : <b>${esc(r.fournisseur)}</b>`);
  if (devisTxt) plan.push(get(L, "devis.ref") ? `Devis : déjà rempli (${esc(get(L, "devis.ref"))})` : `Devis : <b>${esc(devisTxt)}</b>`);
  if (!get(L, "devis.statut")) plan.push(`Statut du devis : <b>Reçu</b>`);
  plan.push(items.length ? `Matériel : <b>${items.length} ligne${items.length > 1 ? "s" : ""}</b> à ajouter${dup ? ` (${dup} déjà dans la liste)` : ""}${transport.length ? ` · transport ignoré` : ""}` : `Matériel : rien de nouveau${dup ? ` (${dup} ligne${dup > 1 ? "s" : ""} déjà dans la liste)` : ""}`);
  box.innerHTML = `<div>Lu dans le devis${r.fournisseur ? " de <b>" + esc(r.fournisseur) + "</b>" : ""} :</div><ul>${plan.map(p => `<li>${p}</li>`).join("")}</ul>
    ${items.length ? `<details><summary class="ok">Voir les lignes</summary><ul>${items.map(a => `<li>${esc(a.q != null ? String(a.q).replace(".", ",") + " × " : "")}${esc(a.d)}</li>`).join("")}</ul></details>` : ""}
    <div class="acts"><button type="button" class="btn primary sm" data-fill>Remplir la fiche</button><button type="button" class="btn sm" data-close>Fermer</button></div>`;
  box.querySelector("[data-close]").onclick = () => box.hidden = true;
  box.querySelector("[data-fill]").onclick = () => {
    const undo = [];
    const set = (p, v) => { undo.push([p, get(localDoc(), p) ?? ""]); edit(p, v); };
    const P = "loc." + k;
    if (r.fournisseur && !L.loueur) set(P + ".loueur", r.fournisseur);
    if (devisTxt && !get(L, "devis.ref")) set(P + ".devis.ref", devisTxt);
    if (!get(L, "devis.statut")) set(P + ".devis.statut", "Reçu");
    if (k !== "autre" && L.actif !== "oui") set(P + ".actif", "oui");
    const lineup = lineupOf(d), who = lineup.length === 1 ? { [lineup[0].id]: true } : {};
    const t0 = Date.now(), added = [];
    items.forEach((a, i) => {
      const iid = "m" + newId().slice(0, 9);
      const q = a.q != null && a.q > 0 ? String(Math.round(a.q * 100) / 100) : "1";
      edit(`${P}.items.${iid}`, { qte: q, des: a.d, ref: "", who, rendu: false, createdAt: t0 + i });
      added.push(`${P}.items.${iid}`);
    });
    flush(); syncSheet(current);
    box.innerHTML = `<span>Fiche remplie${added.length ? ` · ${added.length} ligne${added.length > 1 ? "s" : ""} de matériel ajoutée${added.length > 1 ? "s" : ""}` : ""}.</span>
      <div class="acts"><button type="button" class="btn sm" data-undo>Annuler</button><button type="button" class="btn sm" data-close>Fermer</button></div>`;
    box.querySelector("[data-close]").onclick = () => box.hidden = true;
    box.querySelector("[data-undo]").onclick = () => {
      undo.forEach(([p, v]) => edit(p, v)); added.forEach(p => edit(p, null));
      flush(); syncSheet(current);
      box.innerHTML = `<span class="ok">Annulé : la fiche est revenue comme avant.</span> <button type="button" class="linkbtn" data-close>Fermer</button>`;
      box.querySelector("[data-close]").onclick = () => box.hidden = true;
    };
  };
}

async function upload(el, path, file) {
  el.dataset.busy = "1"; el.innerHTML = `<span class="busy">Envoi de ${esc(file.name)}…</span>`;
  try {
    if (file.size > 4.4 * 1024 * 1024) throw { code: "too_large" };
    const type = file.type || (/\.pdf$/i.test(file.name) ? "application/pdf" : "image/jpeg");
    const r = await fetch("/api/upload", { method: "POST", body: file, credentials: "same-origin",
      headers: { "Content-Type": type, "X-Fiche": current, "X-Filename": encodeURIComponent(file.name) } });
    if (r.status === 401) { showLogin(); return; }
    if (!r.ok) throw { code: r.status === 413 ? "too_large" : r.status === 415 ? "type" : "server" };
    const { path: blobPath } = await r.json();
    edit(path, { path: blobPath, name: file.name });
    if (/\.riderFile$/.test(path)) edit(path.replace(/riderFile$/, "rider"), "oui");
    flush();
  } catch (e) {
    toast(e && e.code === "too_large" ? "Fichier trop lourd : 4,4 Mo maximum. Compresse le PDF puis réessaie."
      : e && e.code === "type" ? "Formats acceptés : PDF, JPG, PNG, WEBP, HEIC."
      : "L'envoi du fichier a échoué. Réessaie dans un instant.");
  }
  delete el.dataset.busy; renderAttach(el, localDoc());
  if (current) syncSheet(current);
}

function fillDatalists() {
  const loueurs = new Set(), noms = new Map(), fonctions = new Set(), matos = new Set();
  events.forEach(e => {
    LOCS.forEach(l => { const v = get(e, "loc." + l.k + ".loueur"); if (v) loueurs.add(v.trim()); itemsOf(get(e, "loc." + l.k)).forEach(it => { if (it.des) matos.add(it.des.trim()); }); });
    [1, 2, 3, 4].forEach(i => { const c = get(e, "contacts.c" + i); if (c && c.nom) { noms.set(c.nom.trim(), c); if (c.fonction) fonctions.add(c.fonction.trim()); } });
  });
  const set = (id, vals) => { const dl = $("#" + id); if (dl) dl.innerHTML = [...vals].sort((a, b) => a.localeCompare(b, "fr")).map(v => `<option value="${esc(v)}">`).join(""); };
  set("dl-loueurs", loueurs); set("dl-contacts", noms.keys()); set("dl-fonctions", fonctions); set("dl-matos", matos);
  fillDatalists.contacts = noms;
}

function autofillContact(slot, nom) {
  const known = fillDatalists.contacts && fillDatalists.contacts.get(nom.trim()); if (!known) return;
  const d = localDoc(); let changed = false;
  ["fonction", "tel", "mail"].forEach(k => {
    const p = `contacts.${slot}.${k}`;
    if (!get(d, p) && known[k]) { edit(p, known[k]); const el = app.querySelector(`[data-path="${p}"]`); if (el) el.value = known[k]; changed = true; }
  });
  if (changed) flush();
}

// ---------- timeline ----------
function mins(t) { if (!t) return null; const [h, m] = t.split(":").map(Number); return h * 60 + m; }
function drawFrise() {
  const box = $("#frise"); if (!box) return;
  const doc = localDoc(); const P = planning(doc); const t = P.t;
  const vals = Object.values(t).concat(P.sets.flatMap(x => [x.a, x.b]), P.bals.flatMap(x => [x.a, x.b]), P.moms.flatMap(m => m.b != null ? [m.a, m.b] : [m.a]));
  if (vals.length < 2) { box.innerHTML = `<div class="ph">Renseigne au moins deux horaires pour voir la journée sur une frise.</div>`; drawEditor(); return; }
  const lo = Math.floor((Math.min(...vals) - 10) / 60) * 60, hi = Math.ceil((Math.max(...vals) + 10) / 60) * 60;
  const span = Math.max(60, hi - lo), pct = v => ((v - lo) / span * 100).toFixed(3) + "%";
  const hm = v => { const m = ((v % 1440) + 1440) % 1440; return `${String(Math.floor(m / 60)).padStart(2, "0")}h${String(m % 60).padStart(2, "0")}`; };
  const sel = drawFrise.sel;
  const seg = (key, label, cls, a, b, style) => `<button type="button" class="seg ${cls}${sel === key ? " sel" : ""}" data-edit="${key}" style="left:${pct(a)};width:calc(${pct(b)} - ${pct(a)});${style}" title="${esc(label)} · ${hm(a)} – ${hm(b)}">${esc(label)}</button>`;
  const main = [
    ["main:montage", "Montage", "--seg-montage", t.montageDebut, t.montageFin],
    ["main:soundcheck", "Soundcheck", "--seg-sound", t.soundcheckDebut, t.soundcheckFin],
    ["main:demontage", "Démontage", "--seg-demo", t.demontageDebut, t.demontageFin],
  ].filter(x => x[3] != null && x[4] != null && x[4] > x[3]);

  // Door labels above the lanes; two rows when they would collide.
  const doors = [["ouverture", "Ouverture portes", false], ["fermPublic", "Fermeture public", false], ["fermPortes", "Fermeture portes", true]]
    .filter(([k]) => t[k] != null).map(([k, lab, dash]) => ({ k, lab, dash, v: t[k] })).sort((x, y) => x.v - y.v);
  // Each label is placed on the first row where it does not touch another one (estimated width in px).
  const W = box.clientWidth || 800, ROW = 22, rows = [];
  doors.forEach(dr => {
    const x = (dr.v - lo) / span * W, w = (dr.lab.length + 6) * 7 + 14;
    dr.right = x + w > W;
    const a = dr.right ? x - w : x, b = dr.right ? x : x + w;
    let r = 0; while (rows[r] && rows[r].some(([p, q]) => a < q + 8 && b > p - 8)) r++;
    (rows[r] = rows[r] || []).push([a, b]); dr.row = r;
  });
  const nRows = Math.max(1, rows.length), H = nRows * ROW + 6;
  let html = `<div class="doors" style="height:${H}px">` + doors.map(dr => {
    const top = (nRows - 1 - dr.row) * ROW;
    return `<span class="stem${dr.dash ? " dash" : ""}" style="left:${pct(dr.v)};top:${top + 16}px"></span>` +
      `<button type="button" class="door${dr.right ? " right" : ""}${sel === "door:" + dr.k ? " sel" : ""}" data-edit="door:${dr.k}" style="left:${pct(dr.v)};top:${top}px" title="${dr.lab} · ${hm(dr.v)}">${dr.lab} ${hm(dr.v)}</button>`;
  }).join("") + `</div>`;

  // Background: hour grid and the time the public is on site.
  const labelStep = span > 18 * 60 ? 120 : 60;
  html += `<div class="lanes"><div class="bg">`;
  if (t.ouverture != null) { const zEnd = t.fermPublic ?? t.fermPortes; if (zEnd != null && zEnd > t.ouverture) html += `<div class="zone" style="left:${pct(t.ouverture)};width:calc(${pct(zEnd)} - ${pct(t.ouverture)})" title="Public sur site"></div>`; }
  for (let v = lo; v <= hi; v += 30) html += `<i class="${v % 60 ? "half" : ""}" style="left:${pct(v)}"></i>`;
  html += `</div><div class="track">`;
  main.forEach(([k, lab, c, a, b]) => html += seg(k, lab, "", a, b, `background:var(${c})`));
  if (P.sets.length) {
    const a = Math.min(...P.sets.map(x => x.a)), b = Math.max(...P.sets.map(x => x.b));
    html += `<div class="seg derived" style="left:${pct(a)};width:calc(${pct(b)} - ${pct(a)});background:var(--seg-show)" title="Show · ${hm(a)} – ${hm(b)} · calculé depuis le line-up">Show</div>`;
  } else if (t.ouverture != null && (t.fermPublic ?? t.fermPortes) != null) {
    html += seg("main:show", "Show (prévu)", "planned", t.ouverture, t.fermPublic ?? t.fermPortes, "");
  }
  html += `</div>`;
  const artColor = i => `var(${i % 2 ? "--art-b" : "--art-a"})`;
  if (P.sets.length || P.bals.length) {
    html += `<div class="track arts">`;
    P.bals.forEach(x => html += seg("bal:" + x.id, "Balance " + x.nom + (x.warn ? " · public présent" : ""), "bal" + (x.warn ? " warn" : ""), x.a, x.b, `background-color:${artColor(x.i)}`));
    P.sets.forEach(x => html += seg("set:" + x.id, x.nom + (x.conflict ? " · chevauchement" : x.late ? " · après fermeture" : ""), x.conflict || x.late ? "warn" : "", x.a, x.b, `background-color:${artColor(x.i)}`));
    html += `</div>`;
    if (P.gaps.length) html += `<div class="gaps">` + P.gaps.map(g => `<span class="gap" style="left:${pct((g.a + g.b) / 2)}" title="Changement de plateau">↔ ${fmtDur(g.b - g.a)}</span>`).join("") + `</div>`;
  }
  if (P.moms.length) {
    html += `<div class="track moms">`;
    P.moms.forEach(m => {
      const lab = (m.type || "Moment") + (m.label ? " · " + m.label : "");
      html += m.b != null ? seg("mom:" + m.id, lab, "mom", m.a, m.b, "")
        : `<button type="button" class="pin${sel === "mom:" + m.id ? " sel" : ""}" data-edit="mom:${m.id}" style="left:${pct(m.a)}" title="${esc(lab)} · ${hm(m.a)}">${esc(lab)}</button>`;
    });
    html += `</div>`;
  }
  html += `<div class="dl">` + doors.map(dr => `<b class="${dr.dash ? "dash" : ""}" style="left:${pct(dr.v)}"></b>`).join("") + `</div></div>`;
  html += `<div class="ticks">`;
  for (let v = lo; v <= hi; v += labelStep) { const hh = Math.floor(v / 60) % 24; html += `<span style="left:${pct(v)}">${String(hh).padStart(2, "0")}h</span>`; }
  html += `</div><div class="hint">Clique sur un bloc pour modifier ses horaires.</div>`;
  box.innerHTML = html;
  drawEditor();
}

// Small editor under the timeline for the block that was clicked.
function drawEditor() {
  const box = $("#frise-edit"); if (!box) return;
  const key = drawFrise.sel, d = localDoc();
  let spec = null;
  if (key) {
    const [kind, id] = key.split(":");
    const MAIN = { montage: ["Montage", "h.montageDebut", "h.montageFin", "Début", "Fin"], soundcheck: ["Soundcheck", "h.soundcheckDebut", "h.soundcheckFin", "Début", "Fin"],
      show: ["Show", "h.ouverture", "h.fermPublic", "Ouverture des portes", "Fermeture au public"], demontage: ["Démontage", "h.demontageDebut", "h.demontageFin", "Début", "Fin"] };
    const a = (kind === "set" || kind === "bal") ? get(d, "lineup." + id) : null;
    const m = kind === "mom" ? get(d, "moments." + id) : null;
    if (kind === "main" && MAIN[id]) spec = MAIN[id];
    else if (kind === "set" && a) spec = ["Passage · " + (a.nom || "Artiste"), `lineup.${id}.debut`, `lineup.${id}.fin`, "Début", "Fin"];
    else if (kind === "bal" && a) spec = ["Balance · " + (a.nom || "Artiste"), `lineup.${id}.bdebut`, `lineup.${id}.bfin`, "Début", "Fin"];
    else if (kind === "door") spec = { ouverture: ["Ouverture des portes", "h.ouverture", null, "Heure"], fermPublic: ["Fermeture au public", "h.fermPublic", null, "Heure"], fermPortes: ["Fermeture des portes", "h.fermPortes", null, "Heure"] }[id] || null;
    else if (kind === "mom" && m) spec = [(m.type || "Moment") + (m.label ? " · " + m.label : ""), `moments.${id}.debut`, `moments.${id}.fin`, "Heure", "Fin (facultatif)"];
  }
  if (!spec) { box.hidden = true; box.innerHTML = ""; drawEditor.key = null; return; }
  box.hidden = false;
  if (drawEditor.key !== key) {
    drawEditor.key = key;
    box.innerHTML = `<h4>${esc(spec[0])}</h4>
      <label>${spec[3]}<input type="time" data-path="${spec[1]}"${canWrite ? "" : " disabled"}></label>
      ${spec[2] ? `<label>${spec[4]}<input type="time" data-path="${spec[2]}"${canWrite ? "" : " disabled"}></label>` : ""}
      <button type="button" class="btn" data-close-edit>Fermer</button>`;
  } else box.querySelector("h4").textContent = spec[0];
  box.querySelectorAll("input").forEach(el => { if (el !== document.activeElement) el.value = get(d, el.dataset.path) || ""; });
}

// ---------- saving ----------
function edit(path, value) { pending[path] = value; setSave("Modifications en cours…"); scheduleFlush(800); }
function scheduleFlush(ms) { clearTimeout(flushTimer); flushTimer = setTimeout(flush, ms); }
function setSave(t) { const s = $("#savestate"); if (s) s.textContent = t; }
async function flush() {
  clearTimeout(flushTimer);
  const id = current; const entries = Object.entries(pending).sort((a, b) => a[0].split(".").length - b[0].split(".").length);
  if (!id || !entries.length) return;
  pending = {};
  const patch = {};
  entries.forEach(([p, v]) => { setIn(patch, p, v); inflight.set(p, v); });
  patch.updatedBy = me || "";
  setSave("Enregistrement…");
  try {
    const { id: _id, ...doc } = await api("PATCH", "/api/events/" + id, patch);
    events.set(id, doc);
    setSave("Enregistré");
    entries.forEach(([p]) => inflight.delete(p));
    if (current === id) syncSheet(id);
  } catch (e) {
    entries.forEach(([p, v]) => { if (pending[p] === undefined) pending[p] = v; });
    handleWriteError(e);
  } finally {
    entries.forEach(([p]) => inflight.delete(p));
  }
}
function handleWriteError(e) {
  const code = e && e.code;
  if (code === "auth") { setSave(""); return; }
  if (code === "not_found") { pending = {}; setSave(""); toast("Cette fiche a été supprimée par quelqu'un d'autre."); go(null); return; }
  else { setSave("Non enregistré, nouvel essai…"); scheduleFlush(3000); }
}
window.addEventListener("pagehide", flush);
document.addEventListener("visibilitychange", () => { if (document.hidden) flush(); });

// ---------- duplicate / delete ----------
async function duplicate(id) {
  await flush();
  const src = clone(events.get(id));
  const d = Object.assign(blankEvent(), src, { numero: "", date: "", nom: (src.nom || "Sans nom") + " (copie)", createdAt: Date.now(), updatedAt: Date.now(), updatedBy: me || "" });
  LOCS.forEach(l => { const L = d.loc[l.k]; if (L) { L.devis = { ref: "", statut: "", file: null }; L.facture = { ref: "", statut: "", file: null }; Object.values(L.items || {}).forEach(it => { if (it) it.rendu = false; }); } });
  const nid = newId();
  try { await api("POST", "/api/events", { id: nid, data: d }); events.set(nid, d); toast("Fiche dupliquée. Pense à changer le n° et la date."); go(nid); }
  catch (e) { handleWriteError(e); }
}
function armDelete(btn, id) {
  if (!btn.classList.contains("armed")) {
    btn.classList.add("armed"); btn.textContent = "Confirmer la suppression";
    setTimeout(() => { if (btn.isConnected) { btn.classList.remove("armed"); btn.textContent = "Supprimer"; } }, 4000);
    return;
  }
  pending = {};
  api("DELETE", "/api/events/" + id).then(() => { events.delete(id); toast("Fiche supprimée."); go(null); }).catch(handleWriteError);
}

// ---------- Word export (fills the original sheet) ----------
function xmlText(s) {
  return esc(s).replace(/&#39;/g, "&apos;").split(/\r?\n/).join('</w:t><w:br/><w:t xml:space="preserve">');
}
async function exportDocx(id) {
  await flush();
  const e = localDoc();
  const btn = $("#export"); if (btn) { btn.disabled = true; btn.textContent = "Préparation…"; }
  try {
    const tpl = await fetch("/fiche-template.docx").then(r => { if (!r.ok) throw new Error("template"); return r.arrayBuffer(); });
    const zip = await JSZip.loadAsync(tpl);
    let xml = await zip.file("word/document.xml").async("string");
    const h = e.h || {};
    const arts = lineupOf(e);
    const bal = a => a.balance === "oui" ? (range(a.bdebut, a.bfin) ? "balance " + range(a.bdebut, a.bfin) : "balance") : a.balance === "non" ? "pas de balance" : "";
    const art = arts.map(a => [a.nom || "Artiste", a.type ? `(${a.type.replace(/^(Groupe|Live|Autre)$/, m => m.toLowerCase())})` : "", range(a.debut, a.fin), bal(a) ? `[${bal(a)}]` : ""].filter(Boolean).join(" ")).join("  ·  ");
    const momTxt = momentsOf(e).filter(m => m.debut).map(m => `•  ${m.fin ? range(m.debut, m.fin) : fmtTime(m.debut)}   ${m.type || "Moment"}${m.label ? " — " + m.label : ""}`).join("\n");
    const v = {
      NUM: e.numero || "000", NOM: e.nom || "", DATE: e.date ? "(" + fmtDate(e.date, true) + ")" : "",
      ARTISTES_INLINE: art, PAD: "      ", ARTISTES_BELOW: "",
      montage: range(h.montageDebut, h.montageFin), soundcheck: range(h.soundcheckDebut, h.soundcheckFin), show: "",
      ouverture: fmtTime(h.ouverture), duree: (h.duree || fmtDur(showMins(e))) ? ": " + (h.duree || fmtDur(showMins(e))) : "", fermPublic: h.fermPublic ? ": " + fmtTime(h.fermPublic) : "", fermPortes: h.fermPortes ? ": " + fmtTime(h.fermPortes) : "",
      demontage: range(h.demontageDebut, h.demontageFin), commentaires: (momTxt ? "\nMoments de la journée :\n" + momTxt + "\n" : "") + (e.commentaires ? "\n" + e.commentaires : ""),
      autreLabel: get(e, "loc.autre.label") || "",
    };
    const docTxt = (D) => D ? [D.ref, D.statut ? `(${D.statut.toLowerCase()})` : ""].filter(Boolean).join(" ") : "";
    LOCS.forEach(l => {
      const L = get(e, "loc." + l.k) || {};
      const on = l.k === "autre" || L.actif !== "non";
      v[l.k + ".loueur"] = on ? L.loueur || "" : "";
      v[l.k + ".devis"] = on ? docTxt(L.devis) : "";
      const names = Object.fromEntries(arts.map(a => [a.id, a.nom || "Artiste"])); names.commun = "commun";
      const its = on ? itemsOf(L) : [];
      v[l.k + ".facture"] = (on ? docTxt(L.facture) : "") + (its.length ? "\n\nMatériel loué :\n" + its.map(it => `•  ${itemLabel(it)}${it.ref ? " [" + it.ref + "]" : ""} — ${whoOf(it).map(w => names[w] || "?").join(", ") || "à attribuer"}`).join("\n") : "");
    });
    [1, 2, 3, 4].forEach(i => ["nom", "fonction", "tel", "mail"].forEach(k => {
      const val = get(e, `contacts.c${i}.${k}`) || "";
      v[`c${i}.${k}`] = val && (k === "nom" || k === "fonction") ? ": " + val : val;
    }));
    const box = { rider: arts.some(a => a.rider === "oui") ? "oui" : arts.length && arts.every(a => a.rider === "non") ? "non" : "", backline: get(e, "loc.backline.actif"), lumiere: get(e, "loc.lumiere.actif"), machinerie: get(e, "loc.machinerie.actif") };
    xml = xml.replace(/\{\{CB:([a-z]+):(OUI|NON)\}\}/g, (_, k, w) => box[k] === w.toLowerCase() ? "\u2612" : "\u2610");
    xml = xml.replace(/\{\{([A-Za-z0-9_.]+)\}\}/g, (_, k) => xmlText(v[k] ?? ""));
    zip.file("word/document.xml", xml);
    const blob = await zip.generateAsync({ type: "blob", compression: "DEFLATE" });
    const name = `Fiche technique - ${e.numero || "000"} - ${(e.nom || "Projet").replace(/[\\/:*?"<>|]+/g, " ").trim()}.docx`;
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  } catch (err) {
    toast("L'export Word n'a pas abouti. Réessaie dans un instant.");
  } finally { if (btn && btn.isConnected) { btn.disabled = false; btn.textContent = "Exporter en Word"; } }
}

$("#home").onclick = () => { flush(); go(null); };
boot();
})();
